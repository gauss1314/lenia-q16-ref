name: determinism
# G1 configurations (D-066): ARM64 macOS native, x86-64 Windows native, WASM in Chromium.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]   # ARM64 macOS, x86-64 Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup show && rustc --version
      - run: cargo test --release
      - run: cargo build --release
      - name: public vectors v0
        run: tools/check_vectors.sh
      - name: benchmark structures bench/v0 (NTT)
        run: tools/check_bench.sh
  chromium:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support ubuntu 26.04 yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup show
      - run: cargo build --release
      - run: cargo build --release -p lq16-wasm --target wasm32-unknown-unknown
      - name: no float instructions in WASM (spec §7.3)
        run: sudo apt-get install -y -q wabt && tools/wasm_float_scan.sh target/wasm32-unknown-unknown/release/lq16_wasm.wasm
      - run: tools/prepare_vec_tmp.sh
      - name: standalone self-test page is up to date
        run: python3 tools/make_standalone.py --check
      - name: install playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: public vectors v0 and bench/v0 in chromium
        timeout-minutes: 60
        run: |
          python3 -m http.server 8766 >/dev/null 2>&1 &
          sleep 2
          node tools/browser_vectors.mjs chromium
