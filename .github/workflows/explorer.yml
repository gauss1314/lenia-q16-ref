name: explorer
# Cheap Linux-only check for explorer changes: the page's JavaScript port of the spec
# kernel (CH9) must give the same kernel record hash as the Rust reference.
on:
  push:
    paths:
      - 'web/explorer/**'
      - 'tools/explorer_kernel_check.mjs'
      - 'src/kernel.rs'
      - 'src/expneg.rs'
      - 'src/params.rs'
      - '.github/workflows/explorer.yml'
  workflow_dispatch:
concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup show
      - run: cargo build --release
      - name: explorer's JavaScript spec kernel matches the Rust reference (CH9)
        run: node tools/explorer_kernel_check.mjs
