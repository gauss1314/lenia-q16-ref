<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lenia-q16 explorer (Phase 0 prototype)</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --text:#e6e8eb; --muted:#9aa3ad; --accent:#7cc4fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; display:flex; flex-wrap:wrap; gap:16px; padding:16px; }
  #view { background:#000; image-rendering: pixelated; width:min(90vmin, 768px); height:min(90vmin, 768px); border-radius:4px; }
  #panel { background:var(--panel); padding:12px 14px; border-radius:6px; width:320px; display:flex; flex-direction:column; gap:8px; }
  label { display:flex; justify-content:space-between; gap:8px; align-items:center; color:var(--muted); }
  input[type=number], input[type=text], select { width:120px; background:#0d1014; color:var(--text); border:1px solid #333a44; border-radius:4px; padding:3px 6px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#2a3240; color:var(--text); border:1px solid #3a4454; border-radius:4px; padding:5px 9px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #stats { font-family: ui-monospace, monospace; font-size:12px; color:var(--muted); white-space:pre; }
  #err { color:#ff9a8a; white-space:pre-wrap; }
  .note { font-size:12px; color:var(--muted); }
  #plots { background:#0d1014; border-radius:4px; width:292px; height:300px; }
  #note { width:100%; background:#0d1014; color:var(--text); border:1px solid #333a44; border-radius:4px; padding:4px 6px; }
</style>
</head>
<body>
<canvas id="view" width="256" height="256"></canvas>
<div id="panel">
  <div class="note">float32 preview (not the integer reference). Phase 0 prototype for founder play-testing.</div>
  <label>N <select id="N"><option>128</option><option selected>256</option><option>512</option></select></label>
  <label>R <input id="R" type="number" min="5" max="50" value="14"></label>
  <label>T <input id="T" type="number" min="5" max="40" value="12"></label>
  <label>μ <input id="mu" type="number" step="0.0001" min="0.0001" max="0.9999" value="0.1600"></label>
  <label>σ <input id="sigma" type="number" step="0.0001" min="0.0001" max="0.9999" value="0.0170"></label>
  <label>β <input id="beta" type="text" value="1/1" title="p/q terms, inner ring first, comma separated"></label>
  <div class="row"><button id="apply">应用参数</button></div>
  <label>汤：大小 <input id="soupSize" type="number" min="4" max="256" value="40"></label>
  <label>汤：幅度 <input id="soupAmp" type="number" step="0.05" min="0.05" max="1" value="0.9"></label>
  <label>汤：种子 <input id="seed" type="number" value="1"></label>
  <div class="row"><button id="soup">随机汤</button><button id="clear">清空</button></div>
  <div class="row"><button id="play">暂停</button><button id="stepBtn">单步</button></div>
  <label>每帧步数 <input id="spf" type="range" min="1" max="20" value="1"></label>
  <div class="row"><button id="collect">采集（导出状态）</button></div>
  <div id="stats"></div>
  <canvas id="plots" width="584" height="600" title="上：质量（最近 300 个采样）；下：质心轨迹（环面）"></canvas>
  <input id="note" type="text" placeholder="记一笔（回车保存）：看到了什么、为什么停下">
  <div class="row"><button id="exportLog">导出试玩日志</button><button id="newLog">开始新日志</button></div>
  <div id="err"></div>
  <div class="note">点击画面：在该处放一小块随机汤。参数可写在网址 # 后，例如 #R=14&T=12&mu=0.16&sigma=0.017&beta=1/1</div>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const errBox = $('err');
const fail = m => { errBox.textContent = m; throw new Error(m); };

if (!navigator.gpu) fail('WebGPU 不可用：请用最新版 Chrome 或 Edge（桌面）。');
const adapter = await navigator.gpu.requestAdapter();
if (!adapter) fail('没有可用的 WebGPU 适配器。');
const device = await adapter.requestDevice();
device.lost.then(info => { errBox.textContent = 'GPU 设备丢失：' + info.message + '（刷新页面重试；R 或 N 太大时显卡可能超时）'; });
const canvas = $('view');
// ?test: compute only, no presentation (headless CI cannot present WebGPU canvases)
const TEST = new URLSearchParams(location.search).has('test');
const ctx = TEST ? null : canvas.getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();
if (!TEST) ctx.configure({ device, format, alphaMode: 'opaque' });

// ---------- parameters ----------
function parseBeta(s) {
  const terms = s.split(',').map(t => t.trim()).filter(Boolean).map(t => {
    const [p, q] = t.split('/').map(Number);
    if (!(q >= 1 && p >= 0 && p <= q)) fail('β 写法：p/q，例如 1/2,1/1');
    return p / q;
  });
  if (!terms.length || terms.length > 4) fail('β 要 1–4 项');
  return terms;
}
function readParams() {
  return { N: +$('N').value, R: +$('R').value, T: +$('T').value, mu: +$('mu').value,
           sigma: +$('sigma').value, beta: parseBeta($('beta').value), betaText: $('beta').value };
}
function loadHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ['N', 'R', 'T', 'mu', 'sigma', 'beta']) if (h.has(k)) $(k).value = h.get(k);
}
loadHash();

// Continuous kernel (spec §5 continuous definition), normalised, as taps.
function kernelTaps(R, beta) {
  const B = beta.length, taps = [];
  let sum = 0;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const r = Math.hypot(dx, dy) / R;
    if (r >= 1) continue;
    const br = B * r, i = Math.floor(br), s = br - i;
    if (s <= 0 || s >= 1) continue;
    const w = beta[i] * Math.exp(4 - 1 / (s * (1 - s)));
    if (w > 1e-12) { taps.push(dx, dy, w); sum += w; }
  }
  for (let j = 2; j < taps.length; j += 3) taps[j] /= sum;
  return taps;
}

// ---------- GPU resources ----------
const shader = device.createShaderModule({ code: /* wgsl */`
struct P { n: u32, ntaps: u32, mu: f32, sigma: f32, invT: f32, pad0: f32, pad1: f32, pad2: f32 };
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var<storage, read> taps: array<vec4f>;
@group(0) @binding(2) var<storage, read> src: array<f32>;
@group(0) @binding(3) var<storage, read_write> dst: array<f32>;

@compute @workgroup_size(16, 16)
fn step(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= p.n || id.y >= p.n) { return; }
  let n = i32(p.n);
  var u = 0.0;
  for (var k = 0u; k < p.ntaps; k++) {
    let t = taps[k];
    let x = (i32(id.x) + i32(t.x) + n) % n;
    let y = (i32(id.y) + i32(t.y) + n) % n;
    u += t.z * src[u32(y * n + x)];
  }
  let d = (u - p.mu) / p.sigma;
  let g = 2.0 * exp(-0.5 * d * d) - 1.0;
  let i = id.y * p.n + id.x;
  dst[i] = clamp(src[i] + g * p.invT, 0.0, 1.0);
}

struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VOut {
  var xy = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VOut; o.pos = vec4f(xy[vi], 0.0, 1.0); o.uv = (xy[vi] * vec2f(0.5, -0.5)) + vec2f(0.5, 0.5); return o;
}
// colour-blind friendly ramp (approximation of viridis), monotone in luminance
fn ramp(t: f32) -> vec3f {
  let c0 = vec3f(0.267, 0.005, 0.329); let c1 = vec3f(0.229, 0.322, 0.546);
  let c2 = vec3f(0.128, 0.567, 0.551); let c3 = vec3f(0.369, 0.789, 0.383); let c4 = vec3f(0.993, 0.906, 0.144);
  let s = clamp(t, 0.0, 1.0) * 4.0;
  if (s < 1.0) { return mix(c0, c1, s); } if (s < 2.0) { return mix(c1, c2, s - 1.0); }
  if (s < 3.0) { return mix(c2, c3, s - 2.0); } return mix(c3, c4, s - 3.0);
}
@group(0) @binding(4) var<storage, read> show: array<f32>;
@fragment fn fs(v: VOut) -> @location(0) vec4f {
  let x = min(u32(v.uv.x * f32(p.n)), p.n - 1u);
  let y = min(u32(v.uv.y * f32(p.n)), p.n - 1u);
  return vec4f(ramp(show[y * p.n + x]), 1.0);
}
`});

const computePipe = device.createComputePipeline({ layout: 'auto', compute: { module: shader, entryPoint: 'step' } });
const renderPipe = device.createRenderPipeline({ layout: 'auto',
  vertex: { module: shader, entryPoint: 'vs' }, fragment: { module: shader, entryPoint: 'fs', targets: [{ format }] },
  primitive: { topology: 'triangle-list' } });

let P, N, bufs, tapBuf, uni, ntaps, bindStep, bindDraw, cur = 0, stepCount = 0;
const host = { field: null };

function build() {
  P = readParams(); N = P.N;
  canvas.width = N; canvas.height = N;
  const taps = kernelTaps(P.R, P.beta); ntaps = taps.length / 3;
  const tapData = new Float32Array(ntaps * 4);
  for (let k = 0; k < ntaps; k++) tapData.set([taps[3 * k], taps[3 * k + 1], taps[3 * k + 2], 0], 4 * k);
  tapBuf = device.createBuffer({ size: Math.max(16, tapData.byteLength), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(tapBuf, 0, tapData);
  uni = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const u = new ArrayBuffer(32); const dv = new DataView(u);
  dv.setUint32(0, N, true); dv.setUint32(4, ntaps, true);
  dv.setFloat32(8, P.mu, true); dv.setFloat32(12, P.sigma, true); dv.setFloat32(16, 1 / P.T, true);
  device.queue.writeBuffer(uni, 0, u);
  const size = N * N * 4;
  const old = host.field && host.field.length === N * N ? host.field : new Float32Array(N * N);
  bufs = [0, 1].map(() => device.createBuffer({ size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC }));
  device.queue.writeBuffer(bufs[0], 0, old); cur = 0;
  bindStep = [0, 1].map(i => device.createBindGroup({ layout: computePipe.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: uni } }, { binding: 1, resource: { buffer: tapBuf } },
    { binding: 2, resource: { buffer: bufs[i] } }, { binding: 3, resource: { buffer: bufs[1 - i] } }] }));
  bindDraw = [0, 1].map(i => device.createBindGroup({ layout: renderPipe.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: uni } }, { binding: 4, resource: { buffer: bufs[i] } }] }));
  history.replaceState(null, '', `#N=${N}&R=${P.R}&T=${P.T}&mu=${P.mu}&sigma=${P.sigma}&beta=${encodeURIComponent(P.betaText)}`);
}

// deterministic xorshift for soups (preview only)
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

async function readField() {
  const size = N * N * 4;
  const rb = device.createBuffer({ size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder(); enc.copyBufferToBuffer(bufs[cur], 0, rb, 0, size);
  device.queue.submit([enc.finish()]); await rb.mapAsync(GPUMapMode.READ);
  const f = new Float32Array(rb.getMappedRange().slice(0)); rb.unmap(); rb.destroy();
  host.field = f; return f;
}
async function placeSoup(cx, cy) {
  const f = await readField();
  const s = +$('soupSize').value, amp = +$('soupAmp').value, r = rng(+$('seed').value);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const xx = ((cx - (s >> 1) + x) % N + N) % N, yy = ((cy - (s >> 1) + y) % N + N) % N;
    f[yy * N + xx] = r() * amp;
  }
  device.queue.writeBuffer(bufs[cur], 0, f);
  $('seed').value = +$('seed').value + 1;
}

function stepGPU(k) {
  const enc = device.createCommandEncoder();
  for (let i = 0; i < k; i++) {
    const pass = enc.beginComputePass(); pass.setPipeline(computePipe); pass.setBindGroup(0, bindStep[cur]);
    pass.dispatchWorkgroups(Math.ceil(N / 16), Math.ceil(N / 16)); pass.end(); cur = 1 - cur;
  }
  if (!TEST) {
  const rp = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
  rp.setPipeline(renderPipe); rp.setBindGroup(0, bindDraw[cur]); rp.draw(3); rp.end();
  }
  device.queue.submit([enc.finish()]);
  stepCount += k;
}

// ---------- export ("collect"): u16 state record, spec §8.4, plus params ----------
const SPEC_ID = 'lenia-q16/0.2-draft';
async function collect() {
  const f = await readField();
  const rec = new Uint8Array(48 + 2 * N * N), dv = new DataView(rec.buffer);
  'LQ16STAT'.split('').forEach((c, i) => rec[i] = c.charCodeAt(0));
  SPEC_ID.split('').forEach((c, i) => rec[8 + i] = c.charCodeAt(0));
  dv.setUint32(40, N, true); dv.setUint32(44, N, true);
  for (let i = 0; i < N * N; i++) {
    // round half to even on the float32 value (preview export; CH5 q16-rne/1 is the normative rule)
    const v = Math.min(1, Math.max(0, f[i])) * 65535, fl = Math.floor(v), d = v - fl;
    const q = d > 0.5 ? fl + 1 : d < 0.5 ? fl : (fl % 2 === 0 ? fl : fl + 1);
    dv.setUint16(48 + 2 * i, q, true);
  }
  const params = `R=${P.R} T=${P.T} mu=${Math.round(P.mu * 1e4)} sigma=${Math.round(P.sigma * 1e4)} beta=${P.betaText.replace(/\s/g, '')}`;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  download(`state-${stamp}.lq16`, new Blob([rec]));
  download(`params-${stamp}.txt`, new Blob([params + '\n']));
  const last = series[series.length - 1];
  logEvent('collect', { file: `state-${stamp}.lq16`, params, mass: last ? +last.mass.toFixed(2) : null });
}

// ---------- session log (play log G8, M4) ----------
const LOG_KEY = 'lq16-explorer-log';
function newLog() {
  return { kind: 'lq16-explorer-session', spec_preview: 'float32 continuous kernel (not the integer reference)',
           started: new Date().toISOString(), userAgent: navigator.userAgent,
           adapter: adapter.info ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture, device: adapter.info.device, description: adapter.info.description } : null,
           screen: `${screen.width}x${screen.height}@${devicePixelRatio}`, events: [] };
}
let sessionLog;
try { sessionLog = JSON.parse(localStorage.getItem(LOG_KEY)) || newLog(); } catch { sessionLog = newLog(); }
function logEvent(type, data = {}) {
  sessionLog.events.push({ t: new Date().toISOString(), step: stepCount, type, ...data });
  try { localStorage.setItem(LOG_KEY, JSON.stringify(sessionLog)); } catch {}
}
function paramsLine() { return `R=${P.R} T=${P.T} mu=${Math.round(P.mu * 1e4)} sigma=${Math.round(P.sigma * 1e4)} beta=${P.betaText.replace(/\s/g, '')} N=${N}`; }
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
function exportLog() {
  const sps = sessionLog.events.filter(e => e.type === 'm4').map(e => e.stepsPerSecond).sort((a, b) => a - b);
  sessionLog.exported = new Date().toISOString();
  sessionLog.m4_median_steps_per_s = sps.length ? sps[sps.length >> 1] : null;
  download(`playlog-${sessionLog.started.replace(/[:.]/g, '-')}.json`, new Blob([JSON.stringify(sessionLog, null, 1)], { type: 'application/json' }));
  logEvent('export_log');
}

// ---------- charts: mass and centroid track ----------
const plots = $('plots'), pc = plots.getContext('2d');
let series = [];  // {tu, mass, cx, cy}
function resetSeries() { series = []; }
function centroid(f) {
  // mass-weighted circular mean on the torus
  let sx = 0, sy = 0, cx = 0, cy = 0, m = 0;
  for (let y = 0; y < N; y++) { const ay = 2 * Math.PI * y / N, c = Math.cos(ay), s = Math.sin(ay);
    for (let x = 0; x < N; x++) { const v = f[y * N + x]; if (v === 0) continue; m += v; cy += v * c; sy += v * s;
      const ax = 2 * Math.PI * x / N; cx += v * Math.cos(ax); sx += v * Math.sin(ax); } }
  if (m <= 0) return [NaN, NaN, 0];
  const wrap = a => (a < 0 ? a + 2 * Math.PI : a) / (2 * Math.PI) * N;
  return [wrap(Math.atan2(sx, cx)), wrap(Math.atan2(sy, cy)), m];
}
function drawPlots() {
  const W = plots.width, H = plots.height, h1 = 220;
  pc.fillStyle = '#0d1014'; pc.fillRect(0, 0, W, H);
  pc.fillStyle = '#9aa3ad'; pc.font = '20px system-ui';
  const s = series.slice(-300);
  if (s.length > 1) {
    const ms = s.map(p => p.mass), lo = Math.min(...ms), hi = Math.max(...ms), span = hi - lo || 1;
    pc.fillText(`质量 ${ms[ms.length - 1].toFixed(1)}  (${lo.toFixed(1)}–${hi.toFixed(1)})`, 8, 24);
    pc.strokeStyle = '#7cc4fa'; pc.lineWidth = 2; pc.beginPath();
    s.forEach((p, i) => { const x = 8 + i / (s.length - 1) * (W - 16), y = h1 - 10 - (p.mass - lo) / span * (h1 - 50);
      i ? pc.lineTo(x, y) : pc.moveTo(x, y); }); pc.stroke();
  } else pc.fillText('质量', 8, 24);
  // centroid track on the torus, a square map below
  const top = h1 + 10, size = H - top - 10, left = (W - size) / 2;
  pc.strokeStyle = '#333a44'; pc.strokeRect(left, top, size, size);
  pc.fillText('质心轨迹', 8, top + 20);
  pc.strokeStyle = '#fde725'; pc.lineWidth = 2;
  let prev = null;
  for (const p of series) {
    if (!(p.cx >= 0)) { prev = null; continue; }
    const x = left + p.cx / N * size, y = top + p.cy / N * size;
    if (prev && Math.hypot(x - prev[0], y - prev[1]) < size / 2) { pc.beginPath(); pc.moveTo(prev[0], prev[1]); pc.lineTo(x, y); pc.stroke(); }
    prev = [x, y];
  }
  if (prev) { pc.fillStyle = '#fde725'; pc.beginPath(); pc.arc(prev[0], prev[1], 5, 0, 2 * Math.PI); pc.fill(); }
}

// ---------- UI ----------
let playing = true, frames = 0, t0 = performance.now(), sps = 0, lastSteps = 0, stats = '';
build();
await placeSoup(N >> 1, N >> 1);
logEvent('page_open', { params: paramsLine() });
$('apply').onclick = async () => { if (bufs) await readField(); build(); resetSeries(); logEvent('apply', { params: paramsLine() }); };
$('soup').onclick = () => { logEvent('soup', { x: N >> 1, y: N >> 1, seed: +$('seed').value, size: +$('soupSize').value, amp: +$('soupAmp').value }); resetSeries(); placeSoup(N >> 1, N >> 1); };
$('clear').onclick = () => { host.field = new Float32Array(N * N); device.queue.writeBuffer(bufs[cur], 0, host.field); resetSeries(); logEvent('clear'); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '暂停' : '继续'; logEvent(playing ? 'play' : 'pause'); };
$('exportLog').onclick = exportLog;
$('newLog').onclick = () => { if (confirm('开始新日志？当前日志请先导出。')) { sessionLog = newLog(); logEvent('page_open', { params: paramsLine() }); } };
$('note').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { logEvent('note', { text: e.target.value.trim(), params: paramsLine() }); e.target.value = ''; } };
$('stepBtn').onclick = () => stepGPU(1);
$('collect').onclick = collect;
canvas.onclick = e => { const b = canvas.getBoundingClientRect(); const x = Math.floor((e.clientX - b.left) / b.width * N), y = Math.floor((e.clientY - b.top) / b.height * N);
  logEvent('soup', { x, y, seed: +$('seed').value, size: +$('soupSize').value, amp: +$('soupAmp').value }); placeSoup(x, y); };
window.addEventListener('hashchange', async () => { loadHash(); await readField(); build(); resetSeries(); logEvent('apply', { params: paramsLine(), via: 'url' }); });
document.addEventListener('visibilitychange', () => { if (document.hidden) playing = false, $('play').textContent = '继续'; });

let m4Last = 0, statsBusy = false;
async function refreshStats() {
  if (statsBusy) return;  // a slow GPU must not pile up field reads
  statsBusy = true;
  try { await refreshStatsInner(); } finally { statsBusy = false; }
}
async function refreshStatsInner() {
  const f = await readField();
  const [cx, cy, m] = centroid(f);
  series.push({ tu: stepCount / P.T, mass: m, cx, cy }); if (series.length > 3000) series.shift();
  drawPlots();
  const now = performance.now(); sps = (stepCount - lastSteps) / ((now - t0) / 1000); t0 = now; lastSteps = stepCount;
  stats = `steps   ${stepCount}\ntime    ${(stepCount / P.T).toFixed(1)} TU\nmass    ${m.toFixed(2)}\nsteps/s ${sps.toFixed(0)}   (M4)\ntaps    ${ntaps}`;
  $('stats').textContent = stats;
  window.__m4 = { stepsPerSecond: sps, N, R: P.R, taps: ntaps, adapter: adapter.info ? `${adapter.info.vendor} ${adapter.info.architecture}` : '' };
  // M4: one sample every 10 s while running (spf recorded: more steps per frame raises steps/s)
  if (playing && !document.hidden && performance.now() - m4Last > 10000 && sps > 0) {
    m4Last = performance.now();
    logEvent('m4', { stepsPerSecond: Math.round(sps), N, R: P.R, taps: ntaps, spf: +$('spf').value });
  }
}
setInterval(refreshStats, 1000);
// test hooks (used by headless checks)
window.__lq = { log: () => sessionLog, series: () => series, readField, setField: f => { host.field = new Float32Array(f); device.queue.writeBuffer(bufs[cur], 0, host.field); }, step: k => stepGPU(k), pause: () => { playing = false; }, done: () => device.queue.onSubmittedWorkDone() };
function frame() { if (playing) stepGPU(+$('spf').value); frames++; requestAnimationFrame(frame); }
